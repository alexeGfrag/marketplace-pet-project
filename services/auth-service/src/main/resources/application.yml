server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: false
    change-log: classpath:db.changelog/master.xml
    default-schema: auth
  data:
    mongodb:
      uri: mongodb://admin:secret@localhost:27017/marketplace
      host: mongo
      port: 27017
      database: marketplace
      username: admin
      password: secret

management:
  endpoints:
    web:
      exposure:
        include: health,info