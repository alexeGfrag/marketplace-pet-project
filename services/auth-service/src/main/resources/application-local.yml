#local config for testing
spring:
  datasource:
    url: jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS auth
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db.changelog/master.xml
    default-schema: auth


h2:
  console:
    enabled: true
    path: /h2-console